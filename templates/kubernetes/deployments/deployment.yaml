apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{PROJECT}}
  namespace: {{PROJECT}}
  labels:
    app: {{PROJECT}}
spec:
  replicas: 2
  selector:
    matchLabels:
      app: {{PROJECT}}
  template:
    metadata:
      labels:
        app: {{PROJECT}}
    spec:
      containers:
        - name: {{PROJECT}}
          image: {{IMAGE}}:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: {{PROJECT}}-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
