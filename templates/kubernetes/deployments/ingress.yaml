apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{PROJECT}}
  namespace: {{PROJECT}}
  labels:
    app: {{PROJECT}}
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: {{PROJECT}}.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{PROJECT}}
                port:
                  number: 80
