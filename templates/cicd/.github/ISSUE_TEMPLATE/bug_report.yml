name: Bug report
title: "bug: "
labels: [bug]
description: Report something that is not working as expected.
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      placeholder: Describe the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. make setup
        2. make run
        3. ...
  - type: input
    id: version
    attributes:
      label: Version / commit
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: shell
    validations:
      required: false
